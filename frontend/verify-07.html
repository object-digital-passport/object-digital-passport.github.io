<body>
<main class="page">
  <header class="header-row">
    <div class="header-left"><a href="index.html"><img class="home-logo" src="odp-logo.png" alt="ODP"></a><h1 data-copy="title">Verify a passport</h1><p class="sub" data-copy="subtitle">ODP 0.7 · Polygon</p></div>
    <div class="header-toolbar"><button type="button" id="language" class="btn btn-sec" aria-label="Change language">RU</button></div>
  </header>
  <nav class="nav" aria-label="ODP"><a href="index.html" data-copy="home">Home</a><a href="verify.html" data-copy="legacy">Other verification tools</a></nav>
  <section class="card" style="margin-top:24px"><div class="card-body">
    <p data-copy="intro">Enter a passport ID to read its registration. No wallet is needed.</p>
    <form id="lookup"><label for="passport-id" data-copy="label">Passport ID</label><input id="passport-id" name="id" type="text" autocomplete="off" spellcheck="false" required placeholder="ODP-2026-09-000000001"><label for="unit-index" data-copy="unitLabel">Unit index, if known (starts at 0)</label><input id="unit-index" name="unit" type="number" min="0" max="1048575" step="1" inputmode="numeric"><button class="btn" id="submit" type="submit" data-copy="button">Check registration</button></form>
    <label for="bundle-file" data-copy="bundleLabel">Or select an .odpass file</label><input id="bundle-file" type="file" accept=".odpass,application/zip">
    <p class="fhint" data-copy="scope">File integrity and possession of an edition item are not checked here yet.</p>
    <div id="result" aria-live="polite"></div>
  </div></section>
