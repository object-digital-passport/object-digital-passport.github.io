# CodeQL configuration, read by .github/workflows/codeql.yml.
#
# This only takes effect under **Advanced** code scanning setup. GitHub's Default setup ignores
# config files entirely — which is why an earlier copy sat unused in the monorepo while
# thirteen alerts accumulated against a file nobody can edit.

paths-ignore:
  # esbuild output: the WalletConnect provider bundled for the browser, committed because
  # GitHub Pages serves static files with no build step. Every finding CodeQL reports here is
  # in third-party code, and the next `npm run build:wc` overwrites any edit made to it.
  # The hand-written source that produces it — backend/js/odp-wallet-wc.entry.js — is still scanned.
  - backend/js/odp-wallet-wc.bundle.js
