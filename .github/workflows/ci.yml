name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        working-directory: frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps firefox

      - name: Run
        working-directory: frontend/e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report
          retention-days: 7

  unit:
    name: Read-layer unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: SPEC 0.7 read layer, against the published vectors
        run: node backend/test/odp-contract-0.7.test.mjs

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative links resolve
        run: |
          python3 - <<'PY'
          import re, os, subprocess, sys
          files = subprocess.run(["git","ls-files","*.md"],capture_output=True,text=True).stdout.split()
          bad = []
          for f in files:
              base = os.path.dirname(f)
              for m in re.finditer(r'\]\(([^)\s]+?)(?:#[^)]*)?\)', open(f, encoding="utf-8").read()):
                  t = m.group(1)
                  if t.startswith(("http", "mailto:", "#", "<")):
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(base, t))):
                      bad.append(f"{f} -> {t}")
          for b in bad:
              print("broken:", b)
          print(f"{len(files)} files checked, {len(bad)} broken")
          sys.exit(1 if bad else 0)
          PY
