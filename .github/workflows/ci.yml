name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        working-directory: frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps firefox

      - name: Run
        working-directory: frontend/e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report
          retention-days: 7

  unit:
    name: Read-layer unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install backend test dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify generated browser bundles
        working-directory: backend
        run: |
          npm run build:schemas
          npm run build:safe
          git diff --exit-code -- js/odp-v07-schemas.bundle.js js/odp-v07-safe-app.bundle.js
      - name: SPEC 0.7 read layer, against the published vectors
        run: node backend/test/odp-contract-0.7.test.mjs
      - name: Pinned 0.7 registry reader
        run: node --test backend/test/odp-v07-reader.test.cjs
      - name: 0.7 mint operation preparation
        run: node --test backend/test/odp-v07-mint.test.cjs
      - name: 0.7 immutable issuance job
        run: node --test backend/test/odp-v07-job.test.cjs
      - name: 0.7 draft creation
        run: node --test backend/test/odp-v07-draft.test.cjs
      - name: 0.7 issuance deadline
        run: node --test backend/test/odp-v07-deadline.test.cjs
      - name: 0.7 Safe proposal identity
        run: node --test backend/test/odp-v07-safe.test.cjs
      - name: 0.7 local issuance job storage
        run: node --test backend/test/odp-v07-job-store.test.cjs
      - name: 0.7 portable issuance backup
        run: node --test backend/test/odp-v07-job-backup.test.cjs
      - name: 0.7 issuance hand-off and recovery
        run: node --test backend/test/odp-v07-issue.test.cjs
      - name: 0.7 verified passport export
        run: node --test backend/test/odp-v07-export.test.cjs
      - name: 0.7 profile registration preparation
        run: node --test backend/test/odp-v07-profile.test.cjs
      - name: 0.7 release operation checks
        run: node --test backend/test/odp-v07-release.test.cjs
      - name: 0.7 canonical JSON and strict input
        run: node --test backend/test/odp-v07-canonical.test.cjs
      - name: 0.7 extracted bundle payload checks
        run: node --test backend/test/odp-v07-bundle.test.cjs
      - name: 0.7 schema vectors
        run: node --test backend/test/odp-v07-schemas.test.cjs
      - name: 0.7 passport integrity vectors
        run: node --test backend/test/odp-v07-passport.test.cjs
      - name: 0.7 edition address-list vectors
        run: node --test backend/test/odp-v07-edition.test.cjs
      - name: 0.7 ZIP envelope checks
        run: node --test backend/test/odp-v07-zip.test.cjs
      - name: i18n locale selection and English fallback
        run: node frontend/test/odp-i18n.test.mjs

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative links resolve
        run: |
          python3 - <<'PY'
          import re, os, subprocess, sys
          files = subprocess.run(["git","ls-files","*.md"],capture_output=True,text=True).stdout.split()
          bad = []
          for f in files:
              base = os.path.dirname(f)
              for m in re.finditer(r'\]\(([^)\s]+?)(?:#[^)]*)?\)', open(f, encoding="utf-8").read()):
                  t = m.group(1)
                  if t.startswith(("http", "mailto:", "#", "<")):
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(base, t))):
                      bad.append(f"{f} -> {t}")
          for b in bad:
              print("broken:", b)
          print(f"{len(files)} files checked, {len(bad)} broken")
          sys.exit(1 if bad else 0)
          PY

  translations:
    name: Translation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The freshness check reads `git log` per file, so it needs the history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # docs/TRANSLATIONS.md records what is translated; this enforces that record.
      - name: Check the Russian docs against docs/TRANSLATIONS.md
        run: node tools/check-translations.mjs --all
